name: Release Jetty

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version and create source archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = "$TAG"
          bundle="jetty-${TAG}.tar.gz"
          git archive --format=tar.gz --prefix="jetty-${TAG}/" -o "$bundle" "$TAG"
          sha256sum "$bundle" > "$bundle.sha256"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build static jetty CLI and daemon binary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -trimpath -o jetty-linux-amd64 ./cmd/jetty
          chmod +x jetty-linux-amd64
          sha256sum jetty-linux-amd64 > jetty-linux-amd64.sha256

      - name: Build jetty-desktop with Wails
        run: |
          set -euo pipefail
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          (cd desktop && wails build -tags webkit2_41)
          cp desktop/build/bin/jetty-desktop jetty-desktop-linux-amd64
          chmod +x jetty-desktop-linux-amd64
          sha256sum jetty-desktop-linux-amd64 > jetty-desktop-linux-amd64.sha256

      - name: Publish release assets
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=(--verify-tag --title "Jetty $TAG" --generate-notes)
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "${flags[@]}" \
            "jetty-${TAG}.tar.gz" "jetty-${TAG}.tar.gz.sha256" \
            jetty-linux-amd64 jetty-linux-amd64.sha256 \
            jetty-desktop-linux-amd64 jetty-desktop-linux-amd64.sha256
