[project]
name = "orca-proxy"
version = "0.1.0"
description = "Unified VM credential-injection & logging proxy — core service skeleton"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "cryptography>=42",
    "mitmproxy>=10,<11",
    "PySide6==6.11.2",
]

[project.scripts]
jetty = "orca_proxy.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-aiohttp>=1.0",
]
build = [
    "pyinstaller>=6.16,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orca_proxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
