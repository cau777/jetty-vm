[project]
name = "jetty-gw-agent"
version = "1.0.0"
description = "Transparent mitmproxy gateway agent for Jetty"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.64,<2",
    "mitmproxy>=10.4,<11",
    "protobuf>=5.27.2,<6",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.64,<1.67",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jetty_gw_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
